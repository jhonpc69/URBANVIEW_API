services:
  piuratours:
    build: piuratours
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/chapatupoint  # Cambia a la URL de PostgreSQL
      DB_USER: postgres  # Usuario típico en PostgreSQL
      DB_PASS: 12345  # La contraseña que definiste en el contenedor
      CORS: http://localhost:4200
      SIZE: 10MB
      REQUEST_SIZE: 10MB
    restart: always
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:13
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_DB: chapatupoint
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5