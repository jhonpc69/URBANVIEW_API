spring.application.name=urbanview
server.port=${PORT:8081}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chapatupoint}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:}
cors.hosts.permitidos=${CORS:http://localhost:4200}
spring.servlet.multipart.max-file-size=${SIZE:10MB}
spring.servlet.multipart.max-request-size=${REQUEST_SIZE:10MB}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=604800000
application.security.jwt.secret-key=${JWT_SECRET}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
