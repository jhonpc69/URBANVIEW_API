name: urbanview
services:
  db:
    image: postgres:13@sha256:4689940c683801b4ab839ab3b0a0a3555a5fe425371422310944e89eca7d8068
    environment:
      POSTGRES_DB: chapatupoint
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASS:-urbanview-local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ${URBANVIEW_DB_DATA:-urbanview-db}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chapatupoint"]
      interval: 2s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.27.8@sha256:6abc8e633df15eaf785cfcf38bae48e66f64beecdc03121e249d0f9ec15f0707
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  urbanview-db:
